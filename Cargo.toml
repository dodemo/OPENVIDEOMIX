[workspace]
resolver = "2"
members = [
    "crates/core",
    "apps/openvideomix-desktop"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["dodemo <dodemo@users.noreply.github.com>"]
repository = "https://github.com/dodemo/OPENVIDEOMIX"

[workspace.dependencies]
openvideomix-core = { path = "crates/core" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"
egui = "0.31"
eframe = { version = "0.31", default-features = true }
image = { version = "0.25", default-features = true }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

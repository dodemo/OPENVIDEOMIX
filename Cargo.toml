[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["dodemo <dodemo@users.noreply.github.com>"]
repository = "https://github.com/dodemo/OPENVIDEOMIX"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"

name: Reporte de Erro (Bug Report)
description: Informar dun fallo, erro de compilación ou comportamento inesperado
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Reporte de incidencias técnicas en OPENVIDEOMIX.
  - type: textarea
    id: description
    attributes:
      label: 🐛 Descrición do erro
      description: Que sucedeu e que esperabas que sucedese?
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: 🔄 Pasos para reproducir
      description: Como podemos reproducir o erro no noso equipo?
      placeholder: "1. Executar cargo run\n2. Premer no botón X\n3. Ver o erro..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 📜 Saída da terminal ou mensaxes de erro
      description: Pega aquí os logs ou saídas de erro se hai algún.

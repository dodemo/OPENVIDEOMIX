name: Local authenticated control API

on:
  pull_request:
    paths:
      - 'apps/openvideomix-desktop/src/remote_control.rs'
      - 'apps/openvideomix-desktop/src/app.rs'
      - 'apps/openvideomix-desktop/Cargo.toml'
      - '.github/workflows/local-control-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-control:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev
      - name: Check server formatting
        id: rustfmt
        continue-on-error: true
        run: rustfmt --check --edition 2021 apps/openvideomix-desktop/src/remote_control.rs
      - name: Compile API
        run: cargo check -p openvideomix-desktop --features local-control-api
      - name: Core and API tests
        run: cargo test -p openvideomix-core && cargo test -p openvideomix-desktop --features local-control-api
        shell: bash
      - name: Lint API
        run: cargo clippy -p openvideomix-desktop --all-targets --features local-control-api -- -D warnings
      - name: Enforce formatting
        if: always() && steps.rustfmt.outcome == 'failure'
        run: exit 1
        shell: bash

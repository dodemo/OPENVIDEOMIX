name: Format webcam PoC branch

on:
  push:
    branches:
      - feat/gstreamer-webcam-capture

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.repository == 'dodemo/OPENVIDEOMIX'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit only formatting changes to this feature branch
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.rs'
            git commit -m "style: apply rustfmt across the capture PoC branch"
            git push origin HEAD:feat/gstreamer-webcam-capture
          fi

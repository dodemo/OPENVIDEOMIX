name: Honest broadcast UI smoke test

on:
  pull_request:
    paths:
      - 'apps/openvideomix-desktop/src/app.rs'
      - '.github/workflows/ui-honest-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: UI compile / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux native GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev
      - name: Compile desktop
        run: cargo check -p openvideomix-desktop

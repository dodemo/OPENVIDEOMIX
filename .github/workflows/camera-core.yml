name: Camera core portability

on:
  pull_request:
    paths:
      - 'crates/core/src/camera.rs'
      - 'crates/core/src/lib.rs'
      - '.github/workflows/camera-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-core:
    name: Camera capability tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Camera module format
        run: rustfmt --check --edition 2021 crates/core/src/camera.rs
      - name: Camera core unit tests
        run: cargo test -p openvideomix-core
      - name: Camera core Clippy
        run: cargo clippy -p openvideomix-core --all-targets -- -D warnings

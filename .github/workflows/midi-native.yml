name: Native MIDI feature checks

on:
  pull_request:
    paths:
      - 'apps/openvideomix-desktop/src/midi_input.rs'
      - 'apps/openvideomix-desktop/src/app.rs'
      - 'apps/openvideomix-desktop/Cargo.toml'
      - '.github/workflows/midi-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-optional:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux native desktop / ALSA dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev
      - name: Compile MIDI feature
        run: cargo check -p openvideomix-desktop --features midi-input
      - name: Check MIDI core integration tests
        run: cargo test -p openvideomix-core

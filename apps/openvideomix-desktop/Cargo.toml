[package]
name = "openvideomix-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "openvideomix"
path = "src/main.rs"

[dependencies]
openvideomix-core.workspace = true
eframe.workspace = true
egui.workspace = true
image.workspace = true
rfd = "0.18"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
serde_json = { workspace = true, optional = true }

[features]
default = []
local-control-api = ["dep:axum", "dep:serde", "dep:subtle"]
midi-input = ["dep:midir", "dep:serde_json"]
gstreamer-capture = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.serde]
workspace = true
optional = true

[dependencies.subtle]
version = "2"
optional = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[dependencies.midir]
version = "0.10"
optional = true

[dependencies.gstreamer]
version = "0.24"
optional = true

[dependencies.gstreamer-app]
version = "0.24"
optional = true

[dependencies.gstreamer-video]
version = "0.24"
optional = true
